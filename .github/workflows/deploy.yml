name: Deploy Pipeline

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4


      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}


      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/house-price-prediction:latest .


      # 5. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/house-price-prediction:latest


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      # 6. SSH into EC2 and deploy
      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # Pull latest Docker image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/house-price-prediction:latest

            # Stop existing container
            docker stop house-price-prediction || true

            # Remove existing container
            docker rm house-price-prediction || true

            # Run new container
            docker run -d \
              --name house-price-prediction \
              -p 8000:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/house-price-prediction:latest

            # Check container
            docker ps

            # Deployment message
            echo "======================================"
            echo "Deployment successful!"
            echo "Application: http://${{ secrets.EC2_HOST }}:8000"
            echo "======================================"